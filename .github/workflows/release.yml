name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release to build and publish, for when a release run failed (e.g. v1.28.1-clepsydra.2).
        type: string
        required: true

jobs:
  release-please:
    if: github.event_name == 'push'
    concurrency: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: version
        run: |
          version="$(bash .github/scripts/next-release-version.sh https://github.com/router-for-me/Cli-Proxy-API-Management-Center.git)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: simple
          include-component-in-tag: false
          release-as: ${{ steps.version.outputs.version }}

      - if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=true

  build:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.created == 'true' || inputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - run: bun install --frozen-lockfile

      - run: bun run build
        env:
          VERSION: ${{ env.TAG }}

      - run: mv dist/index.html dist/management.html

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" dist/management.html --clobber
          gh release edit "$TAG" --draft=false --latest
